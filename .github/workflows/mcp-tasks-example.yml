name: MCP Tasks Guide example

on:
  pull_request:
    paths:
      - 'examples/mcp-tasks-thumbnails/**'
      - 'apps/web/content/guides/build-mcp-tasks-with-sharp.mdx'
      - 'apps/web/content/guide-steps/build-mcp-tasks-with-sharp/**'
      - 'apps/web/public/downloads/mcp-tasks-thumbnails/**'
      - '.github/workflows/mcp-tasks-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/mcp-tasks-thumbnails/**'
      - 'apps/web/content/guides/build-mcp-tasks-with-sharp.mdx'
      - 'apps/web/content/guide-steps/build-mcp-tasks-with-sharp/**'
      - 'apps/web/public/downloads/mcp-tasks-thumbnails/**'
      - '.github/workflows/mcp-tasks-example.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/mcp-tasks-thumbnails
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: examples/mcp-tasks-thumbnails/.nvmrc
          cache: pnpm
          cache-dependency-path: examples/mcp-tasks-thumbnails/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fixtures
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run checkpoints
      - run: pnpm run snippets
      - run: pnpm run package --check
