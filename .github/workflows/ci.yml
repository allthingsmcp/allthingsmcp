name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check Node version pins agree
        run: |
          pinned="$(cat .nvmrc)"
          test "$pinned" = "$(awk '/^useNodeVersion:/ {print $2}' pnpm-workspace.yaml)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:memory

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @all-things-mcp/web exec playwright install --with-deps chromium
      - run: pnpm --filter @all-things-mcp/web test:e2e --project=desktop --project=mobile

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Guide Runtime image
        run: docker build -f apps/guide-runtime/Dockerfile -t guide-runtime:ci .
      - name: Check Node major matches .nvmrc
        run: |
          expected="$(cut -d. -f1 .nvmrc)"
          actual="$(docker run --rm --entrypoint node guide-runtime:ci -p 'process.versions.node.split(".")[0]')"
          test "$expected" = "$actual"
