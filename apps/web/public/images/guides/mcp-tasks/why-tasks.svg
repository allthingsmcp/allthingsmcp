<g fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="61.0" y="433" width="18" height="12" rx="2"/><path d="M66.0 449 h8 M70.0 445 v4"/></g>
