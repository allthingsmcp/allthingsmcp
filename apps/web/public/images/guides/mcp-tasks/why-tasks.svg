<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="t d">
<title id="t">A blocking tool call compared with a task-backed tool call</title>
<desc id="d">Top: without Tasks, the MCP client sends tools/call and waits on one open request while the MCP server processes the batch. If the connection times out or drops, the result has nowhere to go. Bottom: with Tasks, the MCP server returns a task handle immediately. The MCP client sends short tasks/get requests, sees progress such as 'Created 6 of 18 thumbnails', and receives the final result in the last tasks/get response.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#53657B"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B9F5A"/></marker>
</defs>
<rect width="560" height="700" fill="#FFFFFF"/>
<rect x="12" y="12" width="536" height="316" rx="12" fill="#F8FAFC" stroke="#DCE4EE" stroke-width="1.5"/>
<text x="24" y="40" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="start">WITHOUT TASKS</text>
<text x="24" y="64" font-family="Geist, Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">One request has to stay open</text>
