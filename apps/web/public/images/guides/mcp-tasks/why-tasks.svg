<rect x="12" y="346" width="536" height="342" rx="12" fill="#FFFFFF" stroke="#0B9F5A" stroke-width="1.5"/>
<text x="24" y="374" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0B9F5A" text-anchor="start">WITH TASKS</text>
<text x="24" y="398" font-family="Geist, Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">Start now, collect the result later</text>
