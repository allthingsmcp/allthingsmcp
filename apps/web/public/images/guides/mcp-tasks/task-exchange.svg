<svg xmlns="http://www.w3.org/2000/svg" width="560" height="820" viewBox="0 0 560 820" role="img" aria-labelledby="t d">
<title id="t">How an MCP client follows a task from tools/call to its result</title>
<desc id="d">1. The MCP client calls tools/call and declares the Tasks extension in the request's _meta. 2. The MCP server saves a task with status working in its task store. 3. Only after the save, it returns a task handle with resultType task and a taskId. 4. A worker processes images and updates the stored status message. 5. The client polls tasks/get with the taskId every pollIntervalMs and sees status working. 6. The client can disconnect and later reconnect with the saved taskId; it does not call the tool again. 7. When the status is completed, the tasks/get response includes the result, the same CallToolResult tools/call would have returned.</desc>
