<text x="20" y="34" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Without MCP</text>
<text x="20" y="56" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3E4C66" text-anchor="start">Every app builds its own integration for every service.</text>
