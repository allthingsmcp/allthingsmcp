<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-labelledby="t d">
<title id="t">Without MCP every app needs a custom integration for every service; with MCP each side is built once</title>
<desc id="d">Top: without MCP, three AI apps (chat app, code editor, agent) and three services (weather API, GitHub, your files) need nine custom integrations, one for every pair. Bottom: with MCP, each app contains an MCP client and each service is wrapped by one MCP server. All of them speak the same protocol, so three clients and three servers are enough and any app can use any server.</desc>
